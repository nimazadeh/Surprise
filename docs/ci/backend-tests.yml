# Backend test workflow (staged).
#
# Activation: copy this file to .github/workflows/backend-tests.yml on a
# credential with workflow permissions:
#   git checkout main && mkdir -p .github/workflows
#   cp docs/ci/backend-tests.yml .github/workflows/backend-tests.yml
#   git add .github/workflows/backend-tests.yml && git commit -m "ci: activate backend tests" && git push
#
# The Phase 2.5 agent sandbox could not perform that copy itself: its GitHub
# App credential lacks the `workflows` permission to push workflow files.
# Until activated, the suite must be run locally (php artisan test).

name: Backend tests

on:
  push:
    paths:
      - 'backend/**'
      - '.github/workflows/backend-tests.yml'
  pull_request:
    paths:
      - 'backend/**'

jobs:
  tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, curl, zip, gd, fileinfo, sqlite3, pdo_sqlite
          coverage: none

      # NOTE: no composer.lock is committed yet (see docs/PACKAGE_AUDIT.md PKG-01);
      # until the lock lands, `install` behaves like `update`. Commit the lock ASAP.
      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Lint (Pint test mode)
        run: vendor/bin/pint --test

      - name: Security gate — no hardcoded owner IDs
        run: "! grep -rn --include='*.php' -E '(user_id|userId|\\bid\\b)\\s*===?\\s*1[^0-9]' app/ routes/ database/ || (echo 'Hardcoded user id check found' && exit 1)"

      - name: Run test suite
        run: php artisan test --parallel
